<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-head" markerHeight="18" markerWidth="18" orient="auto" refX="12" refY="9">
      <path d="M0 0 L18 9 L0 18 Z" fill="#24796d"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#f7f9fc"/>
  <path d="M0 0 H640 V4 H0 Z" fill="#24796d"/>

  <g opacity="0.55" fill="#cfd8e6">
    <circle cx="40" cy="42" r="2"/>
    <circle cx="600" cy="42" r="2"/>
    <circle cx="40" cy="358" r="2"/>
    <circle cx="600" cy="358" r="2"/>
  </g>

  <text x="320" y="50" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="650" fill="#172033">
    Install Markdown Writing
  </text>
  <text x="320" y="75" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
        font-size="12" font-weight="400" fill="#637083">
    Drag to Applications · 拖入应用程序文件夹
  </text>

  <g filter="url(#soft-shadow)">
    <rect x="78" y="138" width="124" height="124" rx="24"
          fill="#ffffff" stroke="#d7deea" stroke-width="2" stroke-dasharray="7 7"/>
    <rect x="438" y="138" width="124" height="124" rx="24"
          fill="#ffffff" stroke="#d7deea" stroke-width="2" stroke-dasharray="7 7"/>
  </g>

  <path d="M259 200 H350" stroke="#24796d" stroke-width="7" stroke-linecap="round"
        marker-end="url(#arrow-head)"/>

  <text x="320" y="346" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
        font-size="10" font-weight="400" fill="#8490a3">
    Local-first Markdown writing
  </text>
</svg>
