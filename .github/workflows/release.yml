name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./...
      - run: go vet ./...
      - name: Require release checksum
        run: test -n "$MD_EDITOR_DMG_SHA256"
        env:
          MD_EDITOR_DMG_SHA256: ${{ secrets.MD_EDITOR_DMG_SHA256 }}
